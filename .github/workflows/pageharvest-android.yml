name: PageHarvest Android debug APK

on:
  push:
    paths:
      - 'android/PageHarvest/**'
      - '.github/workflows/pageharvest-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and assemble APK
        working-directory: android/PageHarvest
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PageHarvest-debug-apk
          path: android/PageHarvest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
